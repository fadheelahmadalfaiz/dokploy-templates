services:
  router:
    image: ghcr.io/decolua/9router:latest
    restart: unless-stopped
    expose:
      - 20128
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
    volumes:
      - router-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${domain}`)"
      - "traefik.http.routers.app.entrypoints=web,websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=20128"

volumes:
  router-data:
