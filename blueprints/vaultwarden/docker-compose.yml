# Vaultwarden with internal PostgreSQL and SMTP-ready environment variables.
services:
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      - DOMAIN
      - ADMIN_TOKEN
      - DATABASE_URL
      - DISABLE_2FA_REMEMBER
      - DISABLE_ADMIN_TOKEN
      - EMAIL_ATTEMPTS_LIMIT
      - EMERGENCY_ACCESS_ALLOWED
      - PASSWORD_HINTS_ALLOWED
      - PUBLIC_DOMAIN
      - SENDS_ALLOWED
      - SHOW_PASSWORD_HINT
      - SIGNUPS_ALLOWED
      - SMTP_DEBUG
      - SMTP_FROM
      - SMTP_FROM_NAME
      - SMTP_HOST
      - SMTP_PASSWORD
      - SMTP_PORT
      - SMTP_SECURITY
      - SMTP_USERNAME
    volumes:
      - vaultwarden:/data
    expose:
      - 80
    depends_on:
      - db
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=vaultwarden

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB
      - POSTGRES_PASSWORD
      - POSTGRES_USER
    volumes:
      - vaultwarden-postgres-data:/var/lib/postgresql/data

volumes:
  vaultwarden:
  vaultwarden-postgres-data:
